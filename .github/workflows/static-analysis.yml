---

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - 'src/**'
      - '.php-cs-fixer.dist.php'
      - 'psalm*'
      - 'tools/psalm/composer.json'
      - 'composer.*'
      - '.github/workflows/static-analysis.yml'
  push:
    paths:
      - 'src/**'
      - '.php-cs-fixer.dist.php'
      - 'psalm*'
      - 'tools/psalm/composer.json'
      - 'composer.*'
      - '.github/workflows/static-analysis.yml'

name: 🔍 Static analysis

jobs:
  psalm:
    timeout-minutes: 4
    runs-on: ${{ matrix.os }}
    env:
      COMPOSER_ROOT_VERSION: '1.x-dev'
    concurrency:
      cancel-in-progress: true
      group: psalm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
        php-version:
          - '8.2'
        dependencies:
          - highest
    steps:
      - name: 📦 Check out the codebase
        uses: actions/checkout@v6

      - name: 🛠️ Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          ini-values: error_reporting=E_ALL
          coverage: none

      - name: 🛠️ Setup problem matchers
        run: echo "::add-matcher::${{ runner.tool_cache }}/php.json"

      - name: 🤖 Validate composer.json
        run: composer validate --ansi --strict

      - name: 📥 Install dependencies with composer
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      # Psalm is isolated via bamarni/composer-bin-plugin and not installed by the root install.
      - name: 🔍 Install isolated Psalm
        run: composer bin psalm install

      - name: 🔍 Run static analysis using vimeo/psalm
        run: composer psalm:ci
